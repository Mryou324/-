<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>さんすうロボ チャレンジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#56CBFF; --gridl:#7ED8FF; --card:#ffffff; --ink:#16244d; --sub:#1d3b66; --line:#b7d3ee;
  --pink:#EE0077; --sky:#56CBFF; --lemon:#FEF748; --lime:#A1ED19; --yellow:#FAEB20; --orange:#FD9311;
  --blue:#EE0077; --good:#A1ED19; --bad:#EE0077;
  --paper:#fffef9; --mas:#e7dcc3; --pen:#1b1a2a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1d0e3a; --gridl:#2c1856; --card:#2b1b52; --ink:#ffffff; --sub:#d9c9ff; --line:#45307a; }
}
:root[data-theme="dark"]{ --bg:#1d0e3a; --gridl:#2c1856; --card:#2b1b52; --ink:#ffffff; --sub:#d9c9ff; --line:#45307a; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;margin:0;color:var(--ink);overflow:hidden;
  background-color:var(--bg);
  background-image:linear-gradient(var(--gridl) 2px,transparent 2px),linear-gradient(90deg,var(--gridl) 2px,transparent 2px);
  background-size:40px 40px;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
.screen{display:none;height:100%;overflow-y:auto;padding:16px 18px;max-width:920px;margin:0 auto;flex-direction:column;gap:14px}
.screen.on{display:flex}
button{
  font:inherit;font-weight:800;font-size:19px;touch-action:manipulation;cursor:pointer;
  border:3px solid var(--ink);border-radius:16px;padding:13px 16px;color:var(--ink);background:var(--card);
  box-shadow:0 5px 0 var(--ink);
}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.go{background:var(--pink);color:#fff;font-size:26px;padding:18px;border-color:#16244d;box-shadow:0 6px 0 #16244d}
.ok{background:var(--lime);color:#16244d;border-color:#16244d;box-shadow:0 5px 0 #16244d}
.row{display:flex;gap:12px}.row>*{flex:1}

/* home */
.logo{text-align:center;margin:6px 0 0;font-weight:900;font-size:clamp(30px,6.5vw,52px);line-height:1.1;letter-spacing:.02em;
  color:var(--lemon);-webkit-text-stroke:2px #16244d;paint-order:stroke fill;text-shadow:5px 5px 0 var(--pink)}
.logo small{display:inline-block;font-size:.42em;font-weight:800;color:#fff;background:var(--pink);-webkit-text-stroke:0;text-shadow:none;margin-top:10px;padding:4px 16px;border-radius:99px}
.garage{display:flex;align-items:center;gap:14px;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:12px 16px}
.garage .rb{width:84px;flex:none}
.garage .info{flex:1;min-width:0}
.garage .pt{font-size:30px;font-weight:900}
.garage .pt span{font-size:16px;color:var(--sub);font-weight:800;margin-left:4px}
.meter{height:16px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--bg);margin:6px 0 4px}
.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(135deg,var(--lemon) 0 12px,var(--orange) 12px 24px);transition:width .6s}
.garage .note{font-size:14px;color:var(--sub);font-weight:800}
h2{margin:6px 0 0;font-size:18px;color:var(--sub)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.units button{font-size:17px;box-shadow:0 3px 0 var(--ink);padding:12px 10px;text-align:left}
.units button b{display:block;font-size:13px;color:var(--sub)}
.units button.sel{background:var(--pink);color:#fff}
.units button.sel b{color:#ffe0f0}
.units button:nth-child(4n+1) {border-left:10px solid var(--orange)}
.units button:nth-child(4n+2) {border-left:10px solid var(--lime)}
.units button:nth-child(4n+3) {border-left:10px solid var(--sky)}
.units button:nth-child(4n+4) {border-left:10px solid var(--yellow)}
.hint{font-size:14px;color:var(--sub);text-align:center;margin:0}

/* game */
.hud{display:flex;align-items:center;gap:10px}
.clock{font-size:30px;font-weight:900;min-width:64px;text-align:right}
.tbar{flex:1;height:22px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--card)}
.tbar i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--lime) 0 14px,var(--yellow) 14px 28px);width:100%}
.tbar.hurry i{background:var(--pink)}
.chip{background:var(--lemon);color:#16244d;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:900;font-size:18px;white-space:nowrap}
.quit{font-size:15px;padding:6px 10px;box-shadow:0 3px 0 var(--ink)}
.q{text-align:center;font-weight:900;color:#fff;-webkit-text-stroke:3px #16244d;paint-order:stroke fill;text-shadow:6px 6px 0 var(--pink);font-size:clamp(52px,12vw,104px);letter-spacing:.03em;margin:4px 0 0;line-height:1.1;font-variant-numeric:tabular-nums}
.combo{text-align:center;height:34px;font-size:26px;font-weight:900;color:var(--lemon);-webkit-text-stroke:1.5px #16244d;paint-order:stroke fill}
.combo.bump{animation:bump .35s}
@keyframes bump{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.boxes{display:flex;justify-content:center;gap:12px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.box{position:relative;width:min(27vw,168px);aspect-ratio:4/5;background:var(--paper);border:4px solid var(--ink);border-radius:12px;overflow:hidden;
  background-image:linear-gradient(to bottom,transparent calc(50% - 1px),var(--mas) calc(50% - 1px),var(--mas) calc(50% + 1px),transparent calc(50% + 1px)),
  linear-gradient(to right,transparent calc(50% - 1px),var(--mas) calc(50% - 1px),var(--mas) calc(50% + 1px),transparent calc(50% + 1px))}
.box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.guess{height:28px;font-size:22px;font-weight:900;color:var(--sub)}
.bx{width:100%;font-size:18px;padding:8px 0;background:var(--lemon);color:#16244d;border-color:#16244d;box-shadow:0 4px 0 #16244d}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
.ctrl{max-width:560px;width:100%;margin:4px auto 0}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:10}
#flash{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0}
#flash.on{animation:flash .5s}
@keyframes flash{0%{opacity:.6}100%{opacity:0}}
#pop{position:fixed;left:50%;top:40%;z-index:11;pointer-events:none;white-space:nowrap;font-weight:900;font-size:clamp(50px,11vw,96px);
  transform:translate(-50%,-50%) scale(0);-webkit-text-stroke:3px #16244d;paint-order:stroke fill;text-shadow:0 6px 0 #16244d}
#pop.show{animation:pop .85s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.3) rotate(4deg);opacity:1}
  45%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}

/* result */
.res{text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:18px}
.res .n{font-size:clamp(70px,16vw,120px);font-weight:900;line-height:1}
.res .n span{font-size:.3em}
.res p{margin:8px 0 0;font-size:19px;font-weight:800}
.res .newbest{color:var(--pink)}
.getbot{text-align:center;background:var(--lemon);border:3px solid var(--ink);border-radius:22px;padding:14px;display:none}
.getbot.on{display:block;animation:bump .6s}
.getbot h3{margin:0 0 6px;font-size:28px;font-weight:900;color:#16244d}
.getbot .bots{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.getbot .bots div{width:130px;color:#16244d;font-weight:900}

/* zukan */
.zk{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.zk div{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:8px;text-align:center;font-weight:900}
.zk .lock svg{filter:brightness(0);opacity:.18}
.zk small{display:block;color:var(--sub);font-size:12px}

/* register */
.regq{text-align:center;font-size:24px;font-weight:900;margin:0}
.regq b{font-size:1.8em;color:var(--pink)}
.regbox{width:min(60vw,280px);margin:0 auto}
@media (prefers-reduced-motion: reduce){#pop.show,.combo.bump,.shake,.getbot.on{animation-duration:.01s}}
</style>
</head>
<body>

<!-- HOME -->
<section class="screen on" id="home">
  <h1 class="logo">さんすうロボ チャレンジ<small>2ふんで なんもん とけるかな？</small></h1>
  <div class="garage">
    <div class="rb" id="homeBot"></div>
    <div class="info">
      <div class="pt"><span id="pts">0</span><span>ポイント</span></div>
      <div class="meter"><i id="meter"></i></div>
      <div class="note" id="nextNote"></div>
    </div>
  </div>
  <h2>もんだいを えらぶ</h2>
  <div class="units" id="units"></div>
  <button class="go" id="startBtn">2ふんチャレンジ スタート！</button>
  <div class="row">
    <button id="zkBtn">ロボットずかん</button>
    <button id="regBtn">じを とうろく</button>
  </div>
  <p class="hint">さいしょに「じを とうろく」をすると、てがきの よみとりが よくなります。</p>
</section>

<!-- GAME -->
<section class="screen" id="game">
  <div class="hud">
    <div class="clock" id="clock">120</div>
    <div class="tbar" id="tbar"><i></i></div>
    <div class="chip">⭕ <span id="cnt">0</span></div>
    <div class="chip">⭐ <span id="earn">0</span></div>
    <button class="quit" id="quitBtn">おわる</button>
  </div>
  <div class="q" id="q"></div>
  <div class="combo" id="combo"></div>
  <div class="boxes" id="boxes">
    <div class="cell"><div class="box"><canvas></canvas></div><div class="guess"></div><button class="bx">けす</button></div>
    <div class="cell"><div class="box"><canvas></canvas></div><div class="guess"></div><button class="bx">けす</button></div>
    <div class="cell"><div class="box"><canvas></canvas></div><div class="guess"></div><button class="bx">けす</button></div>
  </div>
  <div class="row ctrl">
    <button id="clrBtn">ぜんぶけす</button>
    <button class="ok" id="okBtn">こたえる</button>
  </div>
</section>

<!-- RESULT -->
<section class="screen" id="result">
  <div class="res">
    <div class="n" id="rN">0<span>もん</span></div>
    <p id="rSub"></p>
    <p id="rBest"></p>
  </div>
  <div class="getbot" id="getbot"><h3>あたらしいロボットを ゲット！</h3><div class="bots" id="newBots"></div></div>
  <div class="row">
    <button class="go" id="againBtn">もういちど</button>
    <button id="homeBtn">ホームへ</button>
  </div>
</section>

<!-- ZUKAN -->
<section class="screen" id="zukan">
  <h1 class="logo" style="font-size:34px">ロボットずかん</h1>
  <p class="hint" id="zkNote"></p>
  <div class="zk" id="zk"></div>
  <button id="zkBack">ホームへ</button>
</section>

<!-- REGISTER -->
<section class="screen" id="register">
  <h1 class="logo" style="font-size:34px">じを とうろく</h1>
  <p class="regq" id="regQ"></p>
  <div class="regbox"><div class="box" style="width:100%"><canvas id="regCv"></canvas></div></div>
  <div class="row ctrl">
    <button id="regClr">けす</button>
    <button class="ok" id="regOk">とうろく</button>
  </div>
  <div class="row ctrl">
    <button id="regBack">ホームへ</button>
    <button id="regReset">とうろくを ぜんぶけす</button>
  </div>
  <p class="hint" id="regNote"></p>
</section>

<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="pop"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const TOTAL=120, STEP=300;

/* ---------- save ---------- */
function load(){try{return JSON.parse(localStorage.getItem('sansuRobo')||'{}')}catch(e){return {}}}
const S=Object.assign({points:0,best:{},tmpl:[],unit:'g1add'},load());
function save(){try{localStorage.setItem('sansuRobo',JSON.stringify(S))}catch(e){}}

/* ---------- problems ---------- */
const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const UNITS=[
  {id:'g1add',g:'1ねん',label:'たしざん',gen(){const a=r(1,9),b=r(1,9);return{q:`${a} + ${b}`,ans:a+b}}},
  {id:'g1sub',g:'1ねん',label:'ひきざん',gen(){const a=r(2,18),b=r(1,Math.min(9,a-1));return{q:`${a} − ${b}`,ans:a-b}}},
  {id:'g2add',g:'2ねん',label:'2けたの たしざん',gen(){const a=r(10,99),b=r(10,99);return{q:`${a} + ${b}`,ans:a+b}}},
  {id:'g2sub',g:'2ねん',label:'2けたの ひきざん',gen(){const a=r(20,99),b=r(10,a-1);return{q:`${a} − ${b}`,ans:a-b}}},
  {id:'g2mul',g:'2ねん',label:'かけざん（九九）',gen(){const a=r(1,9),b=r(1,9);return{q:`${a} × ${b}`,ans:a*b}}},
  {id:'g3div',g:'3ねん',label:'わりざん',gen(){const b=r(2,9),c=r(1,9);return{q:`${b*c} ÷ ${b}`,ans:c}}},
  {id:'g3mul',g:'3ねん',label:'2けた × 1けた',gen(){const a=r(11,49),b=r(2,9);return{q:`${a} × ${b}`,ans:a*b}}},
  {id:'mix',g:'ぜんぶ',label:'ミックス',gen(){return UNITS[r(0,UNITS.length-2)].gen()}}
];

/* ---------- $P point-cloud recognizer ---------- */
const N=32;
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function pathLen(p){let d=0;for(let i=1;i<p.length;i++)if(p[i].id===p[i-1].id)d+=d2(p[i-1],p[i]);return d}
function resample(src,n){
  const pts=src.map(p=>({x:p.x,y:p.y,id:p.id}));const I=pathLen(pts)/(n-1);let D=0;const out=[{...pts[0]}];
  for(let i=1;i<pts.length;i++){
    if(pts[i].id!==pts[i-1].id)continue;
    const d=d2(pts[i-1],pts[i]);
    if(d>0&&D+d>=I){const t=(I-D)/d;const q={x:pts[i-1].x+t*(pts[i].x-pts[i-1].x),y:pts[i-1].y+t*(pts[i].y-pts[i-1].y),id:pts[i].id};out.push(q);pts.splice(i,0,q);D=0}
    else D+=d;
  }
  while(out.length<n)out.push({...pts[pts.length-1]});
  return out.slice(0,n);
}
function normalize(raw){
  let p=resample(raw,N);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  p.forEach(q=>{x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y)});
  const s=Math.max(x1-x0,y1-y0)||1;p=p.map(q=>({x:(q.x-x0)/s,y:(q.y-y0)/s,id:q.id}));
  let cx=0,cy=0;p.forEach(q=>{cx+=q.x;cy+=q.y});cx/=N;cy/=N;
  return p.map(q=>({x:+(q.x-cx).toFixed(4),y:+(q.y-cy).toFixed(4),id:q.id}));
}
function cloudDist(a,b,start){
  const n=a.length,m=new Array(n).fill(false);let sum=0,i=start;
  do{let mn=Infinity,idx=0;for(let j=0;j<n;j++)if(!m[j]){const d=(a[i].x-b[j].x)**2+(a[i].y-b[j].y)**2;if(d<mn){mn=d;idx=j}}
    m[idx]=true;sum+=(1-((i-start+n)%n)/n)*Math.sqrt(mn);i=(i+1)%n}while(i!==start);
  return sum;
}
function match(a,b){const step=Math.floor(Math.sqrt(N));let mn=Infinity;for(let i=0;i<N;i+=step)mn=Math.min(mn,cloudDist(a,b,i),cloudDist(b,a,i));return mn}

function arc(cx,cy,rx,ry,a0,a1,n=24){const o=[];for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;o.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}return o}
function ln(x1,y1,x2,y2,n=10){const o=[];for(let i=0;i<=n;i++)o.push([x1+(x2-x1)*i/n,y1+(y2-y1)*i/n]);return o}
const DEF={
  '0':[[arc(30,50,24,44,-90,270)],[arc(30,50,24,44,-90,-450)]],
  '1':[[ln(30,5,30,95)],[ln(16,22,30,5).concat(ln(30,5,30,95))]],
  '2':[[arc(30,28,22,22,180,405).concat(ln(45.6,43.6,8,95),ln(8,95,56,95))],[arc(30,30,22,24,200,400).concat(ln(46,45,10,92),ln(10,92,56,92))]],
  '3':[[arc(28,27,22,21,200,450).concat(arc(28,72,24,23,270,520))]],
  '4':[[ln(40,5,6,66).concat(ln(6,66,58,66)),ln(42,32,42,95)],[ln(10,5,6,55).concat(ln(6,55,56,55)),ln(44,5,44,95)]],
  '5':[[ln(14,5,14,46).concat(arc(30,67,24,26,240,510)),ln(14,5,52,5)],[ln(52,5,14,5).concat(ln(14,5,14,46),arc(30,67,24,26,240,510))]],
  '6':[[arc(38,55,28,48,290,180).concat(arc(32,73,22,22,180,-180))]],
  '7':[[ln(8,8,55,8).concat(ln(55,8,26,95))],[ln(8,20,8,8).concat(ln(8,8,55,8),ln(55,8,26,95))]],
  '8':[[arc(30,28,18,22,90,450).concat(arc(30,72,22,23,270,-90))]],
  '9':[[arc(32,28,22,22,0,-360).concat(ln(54,28,50,95))],[arc(32,28,22,22,0,-360).concat(ln(54,28,54,95))]]
};
const SYN=[];
Object.keys(DEF).forEach(k=>DEF[k].forEach(strokes=>{const pts=[];strokes.forEach((s,i)=>s.forEach(([x,y])=>pts.push({x,y,id:i})));SYN.push({name:k,pts:normalize(pts)})}));

function recognize(raw){
  if(raw.length<2||pathLen(raw)<10)return null;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;raw.forEach(q=>{x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y)});
  const w=x1-x0,h=y1-y0;if(Math.max(w,h)<8)return null;
  const strokes=new Set(raw.map(p=>p.id)).size;
  if(strokes===1&&w<h*0.28)return '1';
  const c=normalize(raw);let best=null,bd=Infinity;
  for(const t of SYN.concat(S.tmpl)){let d=match(c,t.pts);if(t.user)d*=0.85;if(d<bd){bd=d;best=t.name}}
  return best;
}

/* ---------- drawing pad ---------- */
let penSeen=false;
class Pad{
  constructor(cv){
    this.cv=cv;this.ctx=cv.getContext('2d');this.strokes=[];this.cur=null;this.pid=null;this.onEnd=null;
    cv.addEventListener('pointerdown',e=>this.down(e));
    cv.addEventListener('pointermove',e=>this.move(e));
    cv.addEventListener('pointerup',e=>this.up(e));
    cv.addEventListener('pointercancel',e=>this.up(e));
  }
  fit(){const b=this.cv.getBoundingClientRect();if(!b.width)return;const d=window.devicePixelRatio||1;
    this.cv.width=Math.round(b.width*d);this.cv.height=Math.round(b.height*d);this.ctx.setTransform(d,0,0,d,0,0);this.lw=Math.max(6,b.width/20);this.redraw()}
  pos(e){const b=this.cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}}
  down(e){
    if(e.pointerType==='pen')penSeen=true;
    if(penSeen&&e.pointerType==='touch')return;
    if(this.cur)return;e.preventDefault();
    try{this.cv.setPointerCapture(e.pointerId)}catch(_){}
    this.pid=e.pointerId;this.cur=[this.pos(e)];this.strokes.push(this.cur);this.dot(this.cur[0]);
  }
  move(e){
    if(!this.cur||e.pointerId!==this.pid)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of (evs.length?evs:[e])){const p=this.pos(ev);const l=this.cur[this.cur.length-1];this.cur.push(p);this.seg(l,p)}
  }
  up(e){if(!this.cur||e.pointerId!==this.pid)return;this.cur=null;this.pid=null;if(this.onEnd)this.onEnd()}
  style(){const c=this.ctx;c.lineWidth=this.lw||8;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#1b1a2a';c.fillStyle='#1b1a2a';return c}
  seg(a,b){const c=this.style();c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
  dot(p){const c=this.style();c.beginPath();c.arc(p.x,p.y,c.lineWidth/2,0,7);c.fill()}
  redraw(){const c=this.ctx;c.save();c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,this.cv.width,this.cv.height);c.restore();
    for(const s of this.strokes){this.dot(s[0]);for(let i=1;i<s.length;i++)this.seg(s[i-1],s[i])}}
  clear(){this.strokes=[];this.cur=null;this.pid=null;this.redraw()}
  points(){const o=[];this.strokes.forEach((s,i)=>s.forEach(p=>o.push({x:p.x,y:p.y,id:i})));return o}
}
const pads=[...document.querySelectorAll('#boxes canvas')].map(c=>new Pad(c));
const guesses=[...document.querySelectorAll('#boxes .guess')];
document.querySelectorAll('#boxes .bx').forEach((b,i)=>b.onclick=()=>{pads[i].clear();guesses[i].textContent=''});
const regPad=new Pad($('#regCv'));
let gT=null;
pads.forEach(p=>p.onEnd=()=>{clearTimeout(gT);gT=setTimeout(updateGuess,200)});
function updateGuess(){pads.forEach((p,i)=>{guesses[i].textContent=recognize(p.points())||''})}

/* ---------- sound ---------- */
let AC=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,t0,dur,type='square',vol=.1){if(!AC)return;const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.03)}
function sGood(c){const b=523*Math.pow(2,Math.min(c-1,12)/12);[0,4,7,12,16].forEach((s,i)=>tone(b*Math.pow(2,s/12),i*.055,.2,'square',.07))}
function sBad(){tone(196,0,.22,'sawtooth',.07);tone(147,.14,.32,'sawtooth',.07)}
function sTick(){tone(1047,0,.06,'sine',.1)}
function sFan(){[[523,0],[659,.12],[784,.24],[1047,.36],[784,.52],[1047,.64]].forEach(([f,t])=>tone(f,t,.3,'square',.08))}

/* ---------- effects ---------- */
const fx=$('#fx'),fc=fx.getContext('2d');let parts=[],running=false;
const COLS=['#EE0077','#56CBFF','#FEF748','#A1ED19','#FAEB20','#FD9311','#ffffff'];
function fitFx(){const d=window.devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;fc.setTransform(d,0,0,d,0,0)}
function burst(x,y,n,pw,up=1){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=pw*(.4+Math.random()*.8);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-up*pw*.6,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:7+Math.random()*9,h:5+Math.random()*6,
      c:COLS[i%COLS.length],star:Math.random()<.25,life:70+Math.random()*50})}
  if(!running){running=true;requestAnimationFrame(loop)}
}
function loop(){
  fc.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>--p.life>0&&p.y<innerHeight+50);
  for(const p of parts){p.vx*=.985;p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.globalAlpha=Math.min(1,p.life/25);fc.fillStyle=p.c;
    if(p.star){fc.font='bold 22px sans-serif';fc.fillText('★',-10,8)}else fc.fillRect(-p.w/2,-p.h/2,p.w,p.h);fc.restore()}
  if(parts.length)requestAnimationFrame(loop);else{running=false;fc.clearRect(0,0,innerWidth,innerHeight)}
}
function pop(text,color){const el=$('#pop');el.textContent=text;el.style.color=color;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function flash(color){const el=$('#flash');el.style.background=color;el.classList.remove('on');void el.offsetWidth;el.classList.add('on')}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- robots ---------- */
const NAMES=['ピカボ','ガンツ','ルルン','ボルト','メカニャン','ドリルまる','スパーク','ゴロン','ジェット','キャノン','ミラクル','ギャラクシー'];
const RC=['#EE0077','#56CBFF','#FEF748','#A1ED19','#FD9311','#FAEB20','#FF5FB0','#2FB8F5','#7FD813','#FFB347','#FF3D8B','#8FE0FF'];
function robotSVG(i){
  const c=RC[i%12],k='#16244d',head=i%3,eye=Math.floor(i/3)%2,ant=Math.floor(i/2)%3;
  let a='';
  if(ant===0)a=`<line x1="60" y1="22" x2="60" y2="6" stroke="${k}" stroke-width="4"/><circle cx="60" cy="6" r="6" fill="#FEF748" stroke="${k}" stroke-width="3"/>`;
  if(ant===1)a=`<line x1="44" y1="22" x2="36" y2="6" stroke="${k}" stroke-width="4"/><line x1="76" y1="22" x2="84" y2="6" stroke="${k}" stroke-width="4"/><circle cx="36" cy="6" r="5" fill="#EE0077" stroke="${k}" stroke-width="3"/><circle cx="84" cy="6" r="5" fill="#EE0077" stroke="${k}" stroke-width="3"/>`;
  if(ant===2)a=`<path d="M60 2 L52 16 L60 14 L56 24 L70 10 L62 12 Z" fill="#FEF748" stroke="${k}" stroke-width="3" stroke-linejoin="round"/>`;
  let h;
  if(head===0)h=`<rect x="26" y="22" width="68" height="50" rx="10" fill="${c}" stroke="${k}" stroke-width="4"/>`;
  else if(head===1)h=`<ellipse cx="60" cy="47" rx="36" ry="27" fill="${c}" stroke="${k}" stroke-width="4"/>`;
  else h=`<rect x="20" y="24" width="80" height="46" rx="23" fill="${c}" stroke="${k}" stroke-width="4"/>`;
  const e=eye===0
    ?`<circle cx="47" cy="45" r="9" fill="#fff" stroke="${k}" stroke-width="3"/><circle cx="73" cy="45" r="9" fill="#fff" stroke="${k}" stroke-width="3"/><circle cx="49" cy="46" r="4" fill="${k}"/><circle cx="75" cy="46" r="4" fill="${k}"/>`
    :`<rect x="36" y="37" width="48" height="16" rx="8" fill="${k}"/><rect x="42" y="42" width="12" height="6" rx="3" fill="#A1ED19"/><rect x="66" y="42" width="12" height="6" rx="3" fill="#A1ED19"/>`;
  return `<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${NAMES[i]}">
  ${a}
  <rect x="12" y="84" width="14" height="30" rx="7" fill="${c}" stroke="${k}" stroke-width="4"/>
  <rect x="94" y="84" width="14" height="30" rx="7" fill="${c}" stroke="${k}" stroke-width="4"/>
  <rect x="38" y="118" width="16" height="18" rx="4" fill="#8a97b8" stroke="${k}" stroke-width="4"/>
  <rect x="66" y="118" width="16" height="18" rx="4" fill="#8a97b8" stroke="${k}" stroke-width="4"/>
  <rect x="28" y="76" width="64" height="46" rx="12" fill="${c}" stroke="${k}" stroke-width="4"/>
  <circle cx="60" cy="99" r="11" fill="#fff" stroke="${k}" stroke-width="3"/>
  <text x="60" y="105" text-anchor="middle" font-size="16" font-weight="900" fill="${k}">${i+1}</text>
  ${h}${e}
  <rect x="50" y="59" width="20" height="6" rx="3" fill="${k}"/>
</svg>`;
}
const owned=p=>Math.min(12,Math.floor(p/STEP));

/* ---------- screens ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  if(id==='home')renderHome();
  if(id==='zukan')renderZukan();
}
function renderHome(){
  $('#pts').textContent=S.points;const o=owned(S.points);
  $('#homeBot').innerHTML=robotSVG(Math.max(0,o-1));
  $('#homeBot').style.opacity=o?1:.35;
  if(o>=12){$('#meter').style.width='100%';$('#nextNote').textContent='ぜんぶの ロボットを あつめた！'}
  else{const rem=STEP-(S.points%STEP);$('#meter').style.width=((S.points%STEP)/STEP*100)+'%';$('#nextNote').textContent=`つぎの ロボットまで あと ${rem} ポイント（${o}/12）`}
  const u=$('#units');u.innerHTML='';
  UNITS.forEach(x=>{const b=document.createElement('button');b.innerHTML=`<b>${x.g}${S.best[x.id]?`　さいこう ${S.best[x.id]}もん`:''}</b>${x.label}`;
    if(x.id===S.unit)b.classList.add('sel');b.onclick=()=>{S.unit=x.id;save();renderHome()};u.appendChild(b)});
}
function renderZukan(){
  const o=owned(S.points);$('#zkNote').textContent=`${STEP}ポイントごとに 1たい もらえるよ（${o}/12）`;
  $('#zk').innerHTML=NAMES.map((n,i)=>i<o?`<div>${robotSVG(i)}${n}</div>`:`<div class="lock">${robotSVG(i)}？？？<small>${(i+1)*STEP}ポイント</small></div>`).join('');
}

/* ---------- game ---------- */
let G=null;
function startGame(){
  audio();
  G={unit:UNITS.find(u=>u.id===S.unit)||UNITS[0],correct:0,wrong:0,combo:0,maxCombo:0,earned:0,q:null,lock:false,lastSec:TOTAL};
  show('game');pads.forEach(p=>{p.fit();p.clear()});
  $('#cnt').textContent=0;$('#earn').textContent=0;$('#combo').textContent='';
  nextQ();G.end=performance.now()+TOTAL*1000;G.timer=setInterval(tick,100);tick();
}
function tick(){
  if(!G)return;const left=Math.max(0,(G.end-performance.now())/1000),sec=Math.ceil(left);
  $('#clock').textContent=sec;$('#tbar i').style.width=(left/TOTAL*100)+'%';$('#tbar').classList.toggle('hurry',left<=10);
  if(sec<G.lastSec){G.lastSec=sec;if(sec<=5&&sec>0)sTick()}
  if(left<=0)endGame();
}
function nextQ(){let q,t=0;do{q=G.unit.gen()}while(G.q&&q.q===G.q.q&&++t<10);G.q=q;$('#q').textContent=q.q+' =';pads.forEach(p=>p.clear());guesses.forEach(g=>g.textContent='')}
function submit(){
  if(!G||G.lock)return;
  const ans=pads.map(p=>recognize(p.points())||'').join('');
  if(!ans){shake($('#boxes'));return}
  if(parseInt(ans,10)===G.q.ans)good();else bad();
}
function good(){
  G.correct++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
  const pt=10+Math.min(G.combo-1,10)*2;G.earned+=pt;
  $('#cnt').textContent=G.correct;$('#earn').textContent=G.earned;
  sGood(G.combo);
  const cols=['#FEF748','#A1ED19','#56CBFF','#FD9311','#EE0077'];
  pop(G.combo>=5?`すごい！ +${pt}`:`せいかい！ +${pt}`,cols[G.combo%cols.length]);
  if(!reduce){
    flash(G.combo>=5?'#FEF748':'#ffffff');
    const qb=$('#q').getBoundingClientRect();burst(innerWidth/2,qb.top+qb.height/2,50+Math.min(G.combo,10)*12,9+Math.min(G.combo,10)*.6);
    if(G.combo>=3){burst(20,innerHeight-20,40,14,1.2);burst(innerWidth-20,innerHeight-20,40,14,1.2)}
  }
  const cb=$('#combo');cb.textContent=G.combo>=2?`${G.combo} れんぞく せいかい！`:'';cb.classList.remove('bump');void cb.offsetWidth;cb.classList.add('bump');
  nextQ();
}
function bad(){
  G.wrong++;G.combo=0;G.lock=true;$('#combo').textContent='';
  sBad();shake($('#boxes'));pop(`こたえは ${G.q.ans}`,'#EE0077');
  setTimeout(()=>{if(G){G.lock=false;nextQ()}},1000);
}
function endGame(){
  if(!G)return;clearInterval(G.timer);const g=G;G=null;
  const before=S.points;S.points+=g.earned;
  const prevBest=S.best[g.unit.id]||0,isBest=g.correct>prevBest&&g.correct>0;if(isBest)S.best[g.unit.id]=g.correct;save();
  $('#rN').innerHTML=`${g.correct}<span>もん</span>`;
  $('#rSub').textContent=`${g.unit.g} ${g.unit.label}　⭐ ${g.earned}ポイント　さいだい ${g.maxCombo}れんぞく`;
  $('#rBest').innerHTML=isBest?'<span class="newbest">じこベスト こうしん！</span>':`じこベスト ${prevBest}もん`;
  const a=owned(before),b=owned(S.points),gb=$('#getbot');
  if(b>a){$('#newBots').innerHTML=Array.from({length:b-a},(_,j)=>`<div>${robotSVG(a+j)}${NAMES[a+j]}</div>`).join('');gb.classList.remove('on');void gb.offsetWidth;gb.classList.add('on')}
  else gb.classList.remove('on');
  show('result');
  if(b>a){sFan();if(!reduce){burst(innerWidth/2,innerHeight/2,220,16)}}
  else if(isBest&&!reduce){sGood(5);burst(innerWidth/2,innerHeight/3,120,12)}
}

/* ---------- register ---------- */
let regI=0;
function regShow(){const d=regI%10;$('#regQ').innerHTML=`<b>${d}</b> を かいてね（${regI+1}/20）`;
  const n=S.tmpl.length;$('#regNote').textContent=n?`いま ${n}こ とうろく されています。`:'0〜9を 2かいずつ かきます。いつも かくように かいてね。';regPad.clear()}
function regStart(){regI=0;show('register');regPad.fit();regShow()}
function regOk(){
  const p=regPad.points();if(p.length<2||pathLen(p)<10){shake($('.regbox'));return}
  S.tmpl.push({name:String(regI%10),pts:normalize(p),user:true});save();audio();sGood(1);
  regI++;if(regI>=20){pop('とうろく かんりょう！','#A1ED19');if(!reduce)burst(innerWidth/2,innerHeight/2,120,12);show('home')}else regShow();
}

/* ---------- wire ---------- */
$('#startBtn').onclick=startGame;
$('#againBtn').onclick=startGame;
$('#homeBtn').onclick=()=>show('home');
$('#zkBtn').onclick=()=>show('zukan');
$('#zkBack').onclick=()=>show('home');
$('#regBtn').onclick=regStart;
$('#regBack').onclick=()=>show('home');
$('#regClr').onclick=()=>regPad.clear();
$('#regOk').onclick=regOk;
$('#regReset').onclick=()=>{if(confirm('とうろくした じを ぜんぶ けしますか？')){S.tmpl=[];save();regShow()}};
$('#okBtn').onclick=submit;
$('#clrBtn').onclick=()=>{pads.forEach(p=>p.clear());guesses.forEach(g=>g.textContent='')};
$('#quitBtn').onclick=endGame;
document.addEventListener('touchmove',e=>{if(e.target.tagName==='CANVAS')e.preventDefault()},{passive:false});
window.addEventListener('resize',()=>{fitFx();pads.forEach(p=>p.fit());regPad.fit()});
fitFx();renderHome();
})();
</script>
</body>
